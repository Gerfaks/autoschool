<!DOCTYPE html>
<html>
<head>
    <title>Вход - Автошкола</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        body { display: flex; align-items: center; }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url("{{ url_for('static', filename='img/hero-driving-school-illustration.png') }}") right 5vw bottom 7vh / min(46vw, 640px) auto no-repeat;
            opacity: 0.18;
            pointer-events: none;
        }
        @media (prefers-reduced-motion: no-preference) {
            body::before { animation: authFloat 7s ease-in-out infinite; }
        }
    </style>
</head>
<body>
    <a href="{{ url_for('index') }}" class="home-link"><i class="fas fa-arrow-left"></i> На главную</a>
    <div class="container auth-shell">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-2"><i class="fas fa-car-side brand-mark"></i> Автошкола</h3>
                        <p class="text-center auth-note mb-4">Войдите, чтобы продолжить работу с расписанием и курсами</p>
                        {% with messages = get_flashed_messages() %}
                            {% for msg in messages %}
                                <div class="alert alert-danger">{{ msg }}</div>
                            {% endfor %}
                        {% endwith %}
                        <form method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="mb-3">
                                <input type="text" name="username" class="form-control" placeholder="Логин" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" name="password" class="form-control" placeholder="Пароль" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Войти</button>
                        </form>
                        <div class="auth-links mt-3">
                            <a href="/register">Подать заявку на регистрацию</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
