<!DOCTYPE html>
<html>
<head>
    <title>Автошкола</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', sans-serif; }
        .hero { text-align: center; color: white; }
        h1 { font-size: 4rem; margin-bottom: 1rem; }
        .btn-custom { background: white; color: #667eea; padding: 15px 50px; border-radius: 50px; font-weight: bold; font-size: 1.2rem; transition: transform 0.3s; text-decoration: none; display: inline-block; }
        .btn-custom:hover { transform: scale(1.05); background: #f0f0f0; color: #667eea; }
        .register-link { color: white; text-decoration: underline; opacity: 0.8; }
        .register-link:hover { opacity: 1; color: white; }
    </style>
</head>
	<body>
	    <div class="hero">
	        <h1><i class="fas fa-car"></i> Автошкола</h1>
	        <p class="lead">Система управления занятиями</p>
	        {% with messages = get_flashed_messages(with_categories=true) %}
	            {% for category, msg in messages %}
	                <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' if category == 'success' else 'info' }} mx-auto" style="max-width: 520px;">{{ msg }}</div>
	            {% endfor %}
	        {% endwith %}
	        <p><a href="/login" class="btn-custom">🚗 Войти</a></p>
        <p class="mt-3">
            <a href="/register" class="register-link">Нет аккаунта? Зарегистрироваться</a>
        </p>
    </div>
</body>
</html>
