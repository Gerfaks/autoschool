{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">Добавить занятие</div>
            <div class="card-body">
                <form method="POST" action="/admin/lesson/add">
                    <div class="mb-3">
                        <label>Дата</label>
                        <input type="date" name="lesson_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Время</label>
                        <input type="time" name="lesson_time" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Тип занятия</label>
                        <select name="lesson_type" class="form-control">
                            <option>Теория</option>
                            <option>Вождение</option>
                            <option>Площадка</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Курсант</label>
                        <select name="kursant_id" class="form-control">
                            {% for s in students %}
                            <option value="{{ s.kursant_id }}">{{ s.fullname }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Инструктор</label>
                        <select name="instructor_id" class="form-control">
                            {% for i in instructors %}
                            <option value="{{ i.instructor_id }}">{{ i.fullname }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Автомобиль</label>
                        <select name="auto_id" class="form-control">
                            {% for c in cars %}
                            <option value="{{ c.auto_id }}">{{ c.brand }} {{ c.model }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Комментарий</label>
                        <textarea name="comments" class="form-control"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/lessons" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
