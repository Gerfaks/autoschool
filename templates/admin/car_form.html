{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">{{ title }}</div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label>Инструктор</label>
                        <select name="instructor_id" class="form-control">
                            <option value="">Автомобиль автошколы</option>
                            {% for i in instructors %}
                                <option value="{{ i.instructor_id }}" {% if car and car.instructor_id == i.instructor_id %}selected{% endif %}>{{ i.fullname }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Марка</label>
                        <input type="text" name="brand" class="form-control" value="{{ car.brand if car else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Модель</label>
                        <input type="text" name="model" class="form-control" value="{{ car.model if car else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Госномер</label>
                        <input type="text" name="plate" class="form-control" value="{{ car.plate if car else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Тип ТС</label>
                        <select name="vehicle_type" class="form-control">
                            {% set selected_type = car.vehicle_type if car else 'Легковой' %}
                            <option {% if selected_type == 'Легковой' %}selected{% endif %}>Легковой</option>
                            <option {% if selected_type == 'Грузовой' %}selected{% endif %}>Грузовой</option>
                            <option {% if selected_type == 'Мотоцикл' %}selected{% endif %}>Мотоцикл</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Фото автомобиля</label>
                        <div class="car-image-frame car-image-form mt-1">
                            {% if car and car.photo_filename %}
                                <img id="car_photo_preview" src="{{ url_for('uploaded_file', filename=car.photo_filename) }}" alt="{{ car.brand }} {{ car.model }}" class="car-image">
                                <div id="car_photo_placeholder" class="car-image-placeholder d-none">
                                    <i class="fas fa-car-side"></i>
                                    <span>Нет фото</span>
                                </div>
                            {% else %}
                                <img id="car_photo_preview" src="" alt="Фото автомобиля" class="car-image d-none">
                                <div id="car_photo_placeholder" class="car-image-placeholder">
                                    <i class="fas fa-car-side"></i>
                                    <span>Нет фото</span>
                                </div>
                            {% endif %}
                        </div>
                    </div>
                    <div class="mb-3">
                        <input type="file" name="photo" class="form-control" accept="image/*" data-car-photo-input data-preview-target="#car_photo_preview" data-placeholder-target="#car_photo_placeholder">
                    </div>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/cars" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
